<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizando PDF con Azure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f5f9;
      color: #1f2937;
      line-height: 1.5;
      min-height: 100vh;
      padding: 40px 16px;
    }

    header {
      max-width: 720px;
      margin: 0 auto 24px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      color: #0f4c81;
      margin-bottom: 6px;
    }

    header p {
      color: #6b7280;
    }

    body > div {
      max-width: 720px;
      margin: 0 auto;
    }

    #formulario {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(15, 76, 129, 0.08);
    }

    #archivo {
      flex: 1 1 260px;
      padding: 10px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #archivo:hover {
      border-color: #0f4c81;
    }

    #archivo::file-selector-button {
      margin-right: 12px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #e2e8f0;
      color: #1f2937;
      cursor: pointer;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #0f4c81;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0c3b65;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #estado {
      flex-basis: 100%;
      font-size: 0.95rem;
      color: #6b7280;
      min-height: 1.4em;
    }

    #estado.error {
      color: #b91c1c;
    }

    #estado.ok {
      color: #15803d;
    }

    #resultado {
      margin-top: 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 8px rgba(15, 76, 129, 0.08);
    }

    #resultado:empty {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Lector de PDF</h1>
    <p>Sube un archivo PDF para analizarlo con Azure...</p>
  </header>

  <div>
    <form action="" id="formulario">
      <input type="file" id="archivo" name="archivo" accept="application/pdf">
      <button type="submit">Extraer datos</button>
      <p id="estado"></p>
    </form>

    <!-- Resultado -->
    <div id="resultado"></div>
  </div>

    <script src="js/app.js"></script>
</body>
</html>
